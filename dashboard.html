<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sentinel — Candidate Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --accent: #00ff88;
    --accent2: #6366f1;
    --text: #e2e8f0;
    --text-dim: #7c8a9e;
    --red: #f43f5e;
    --yellow: #f59e0b;
    --green: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--text-dim); font-weight: 400; font-size: 14px; margin-left: 12px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

  .session-info {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .session-info h2 { font-size: 16px; font-weight: 600; }
  .session-info p { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .stat-row { display: flex; gap: 24px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat .val { font-size: 24px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

  .filters {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters select, .filters input {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  .filters label { font-size: 13px; color: var(--text-dim); }

  .candidates-grid { display: flex; flex-direction: column; gap: 12px; }

  .candidate-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 16px;
    align-items: center;
    transition: border-color 0.2s;
    cursor: pointer;
  }
  .candidate-card:hover { border-color: var(--accent2); }
  .candidate-card.expanded { border-color: var(--accent); }

  .rank {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-dim);
    text-align: center;
  }
  .rank.gold { color: #f59e0b; }
  .rank.silver { color: #94a3b8; }
  .rank.bronze { color: #b45309; }

  .candidate-main { flex: 1; }
  .candidate-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .candidate-meta { font-size: 12px; color: var(--text-dim); display: flex; gap: 16px; flex-wrap: wrap; }

  .scores-row {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .score-box {
    text-align: center;
    min-width: 60px;
  }
  .score-box .val {
    font-size: 20px;
    font-weight: 700;
  }
  .score-box .lbl {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .verdict-badge {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .verdict-badge.STRONG_HIRE { background: rgba(0,255,136,0.15); color: #00ff88; }
  .verdict-badge.HIRE { background: rgba(16,185,129,0.15); color: #10b981; }
  .verdict-badge.HOLD { background: rgba(245,158,11,0.15); color: #f59e0b; }
  .verdict-badge.NO_HIRE { background: rgba(244,63,94,0.15); color: #f43f5e; }

  .expand-details {
    display: none;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    grid-column: 1 / -1;
  }
  .expand-details.open { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .detail-box {
    background: var(--bg);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .detail-box .d-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .detail-box .d-val { font-size: 22px; font-weight: 700; }

  .summary-text { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 12px; }

  .tags-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
  }
  .tag.strength { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid rgba(0,255,136,0.2); }
  .tag.gap { background: rgba(244,63,94,0.1); color: #f43f5e; border: 1px solid rgba(244,63,94,0.2); }

  .compare-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 16px 32px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    z-index: 100;
  }
  .compare-bar.visible { display: flex; }
  .compare-bar p { font-size: 14px; color: var(--text-dim); }
  .compare-bar span { color: var(--accent); font-weight: 600; }
  .btn-compare {
    background: var(--accent);
    color: #0f1117;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }

  .compare-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    overflow-y: auto;
    padding: 32px 16px;
  }
  .compare-modal.open { display: block; }
  .compare-inner {
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    max-width: 900px;
    margin: 0 auto;
  }
  .compare-inner h3 { font-size: 18px; margin-bottom: 20px; }
  .compare-text { font-size: 14px; line-height: 1.8; color: var(--text-dim); white-space: pre-wrap; }
  .btn-close { background: var(--border); border: none; color: var(--text); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 20px; }

  .loading { text-align: center; padding: 60px; color: var(--text-dim); }
  .error { text-align: center; padding: 60px; color: var(--red); }
  .empty { text-align: center; padding: 60px; color: var(--text-dim); }

  .checkbox-wrap { display: flex; align-items: center; }
  .checkbox-wrap input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

  @media (max-width: 600px) {
    .scores-row { gap: 10px; }
    .candidate-card { grid-template-columns: 28px 1fr; }
    .scores-row { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Sentinel <span>Candidate Dashboard</span></div>
  <div style="font-size:13px;color:var(--text-dim);" id="headerSession"></div>
</header>

<div class="container">
  <div id="loadingDiv" class="loading">Loading candidates...</div>
  <div id="errorDiv" class="error" style="display:none;"></div>

  <div id="mainContent" style="display:none;">
    <div class="session-info">
      <div>
        <h2 id="sessionTitle">Assessment Dashboard</h2>
        <p id="sessionSubtitle"></p>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="val" id="statTotal">0</div><div class="lbl">Candidates</div></div>
        <div class="stat"><div class="val" id="statAvg">—</div><div class="lbl">Avg Score</div></div>
        <div class="stat"><div class="val" id="statHire" style="color:var(--green)">0</div><div class="lbl">Hire+</div></div>
        <div class="stat"><div class="val" id="statNoHire" style="color:var(--red)">0</div><div class="lbl">No Hire</div></div>
      </div>
    </div>

    <div class="filters">
      <label>Filter:</label>
      <select id="filterVerdict" onchange="renderCandidates()">
        <option value="">All verdicts</option>
        <option value="STRONG HIRE">Strong Hire</option>
        <option value="HIRE">Hire</option>
        <option value="HOLD">Hold</option>
        <option value="NO HIRE">No Hire</option>
      </select>
      <label>Min score:</label>
      <input type="number" id="filterScore" min="0" max="100" placeholder="0" style="width:70px;" oninput="renderCandidates()"/>
      <label style="margin-left:8px;">Sort by:</label>
      <select id="sortBy" onchange="renderCandidates()">
        <option value="overall">Overall Score</option>
        <option value="experience_fit">Experience Fit</option>
        <option value="performance_score">Performance</option>
      </select>
    </div>

    <div class="candidates-grid" id="candidatesGrid"></div>
    <div class="empty" id="emptyMsg" style="display:none;">No candidates match the current filters.</div>
  </div>
</div>

<!-- Compare bar -->
<div class="compare-bar" id="compareBar">
  <p><span id="compareCount">0</span> candidates selected for comparison</p>
  <div style="display:flex;gap:8px;">
    <button class="btn-clear" onclick="clearSelection()">Clear</button>
    <button class="btn-compare" onclick="runComparison()">Compare Selected →</button>
  </div>
</div>

<!-- Compare modal -->
<div class="compare-modal" id="compareModal">
  <div class="compare-inner">
    <h3>Candidate Comparison</h3>
    <div class="compare-text" id="compareText">Analyzing...</div>
    <button class="btn-close" onclick="document.getElementById('compareModal').classList.remove('open')">Close</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://tkgzbxkvoufvyodidaof.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrZ3pieGt2b3VmdnlvZGlkYW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjM2NTMsImV4cCI6MjEwMDczOTY1M30.fKXpmmMvCILS6fZMVVWmdJOBDG4kmcuBADPWelkrBQ8';

  let allCandidates = [];
  let sessionInfo = null;
  let selectedIds = new Set();

  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session');

  async function init() {
    if (!sessionId) {
      showError('No session ID provided. Please use the link from your email.');
      return;
    }
    document.getElementById('headerSession').textContent = 'Session #' + sessionId;
    try {
      // Load session info
      const sRes = await fetch(SUPABASE_URL + '/rest/v1/sessions?id=eq.' + sessionId + '&select=*', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
      const sessions = await sRes.json();
      if (sessions && sessions.length > 0) sessionInfo = sessions[0];

      // Load candidates
      const cRes = await fetch(SUPABASE_URL + '/rest/v1/candidates?session_id=eq.' + sessionId + '&select=*&order=overall_score.desc', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
      allCandidates = await cRes.json();

      document.getElementById('loadingDiv').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';

      // Header info
      if (sessionInfo) {
        document.getElementById('sessionTitle').textContent = (sessionInfo.company_name || 'Assessment') + ' — Candidates';
        document.getElementById('sessionSubtitle').textContent = 'Role assessment · Session #' + sessionId;
      }

      updateStats();
      renderCandidates();
    } catch(e) {
      showError('Failed to load candidates: ' + e.message);
    }
  }

  function updateStats() {
    const total = allCandidates.length;
    const avg = total ? Math.round(allCandidates.reduce((s,c) => s + (c.overall_score||0), 0) / total) : 0;
    const hire = allCandidates.filter(c => c.verdict === 'STRONG HIRE' || c.verdict === 'HIRE').length;
    const noHire = allCandidates.filter(c => c.verdict === 'NO HIRE').length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statAvg').textContent = total ? avg : '—';
    document.getElementById('statHire').textContent = hire;
    document.getElementById('statNoHire').textContent = noHire;
  }

  function renderCandidates() {
    const verdictFilter = document.getElementById('filterVerdict').value;
    const scoreFilter = parseInt(document.getElementById('filterScore').value) || 0;
    const sortBy = document.getElementById('sortBy').value;

    let filtered = allCandidates.filter(c => {
      if (verdictFilter && c.verdict !== verdictFilter) return false;
      if (scoreFilter && (c.overall_score || 0) < scoreFilter) return false;
      return true;
    });

    filtered.sort((a, b) => (b[sortBy] || 0) - (a[sortBy] || 0));

    const grid = document.getElementById('candidatesGrid');
    const empty = document.getElementById('emptyMsg');

    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = filtered.map((c, i) => {
      const rank = i + 1;
      const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
      const verdictKey = (c.verdict || '').replace(' ', '_');
      const scoreColor = (c.overall_score || 0) >= 80 ? 'var(--green)' : (c.overall_score || 0) >= 60 ? 'var(--yellow)' : 'var(--red)';

      // Parse report JSON if stored as string
      let report = c.report;
      if (typeof report === 'string') { try { report = JSON.parse(report); } catch(e) { report = {}; } }
      const strengths = Array.isArray(report && report.strengths) ? report.strengths : [];
      const gaps = Array.isArray(report && report.gaps) ? report.gaps : [];

      // Parse scores
      let scores = c.scores;
      if (typeof scores === 'string') { try { scores = JSON.parse(scores); } catch(e) { scores = {}; } }

      return `
      <div class="candidate-card" id="card-${c.id}">
        <div class="rank ${rankClass}">#${rank}</div>
        <div class="candidate-main">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <div class="candidate-name">${c.name || 'Candidate'}</div>
            <span class="verdict-badge ${verdictKey}">${c.verdict || 'N/A'}</span>
          </div>
          <div class="candidate-meta">
            <span>${c.email || ''}</span>
            <span>Submitted ${c.created_at ? new Date(c.created_at).toLocaleDateString() : ''}</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          <div class="scores-row">
            <div class="score-box"><div class="val" style="color:${scoreColor}">${c.overall_score || 0}</div><div class="lbl">Overall</div></div>
            <div class="score-box"><div class="val" style="color:var(--accent2)">${c.experience_fit || 'N/A'}</div><div class="lbl">Exp Fit</div></div>
            <div class="score-box"><div class="val" style="color:var(--text)">${c.performance_score || 'N/A'}</div><div class="lbl">Perf</div></div>
            <div class="score-box"><div class="val" style="color:var(--text-dim)">${c.integrity_score || 100}</div><div class="lbl">Integrity</div></div>
          </div>
          <div class="checkbox-wrap" title="Select for comparison">
            <input type="checkbox" id="chk-${c.id}" onchange="toggleSelect('${c.id}')" onclick="event.stopPropagation()" ${selectedIds.has(String(c.id)) ? 'checked' : ''}/>
          </div>
        </div>
        <div class="expand-details ${expandedId === String(c.id) ? 'open' : ''}" id="detail-${c.id}">
          <div class="detail-grid">
            ${scores && typeof scores === 'object' ? Object.entries(scores).map(([k,v]) => `
              <div class="detail-box">
                <div class="d-label">${k.replace(/_/g,' ')}</div>
                <div class="d-val" style="color:${v>=80?'var(--green)':v>=60?'var(--yellow)':'var(--red)'}">${v}/100</div>
              </div>`).join('') : ''}
          </div>
          ${c.summary ? `<div class="summary-text">${c.summary}</div>` : ''}
          ${strengths.length || gaps.length ? `
          <div class="tags-row">
            ${strengths.map(s => `<span class="tag strength">✓ ${s}</span>`).join('')}
            ${gaps.map(g => `<span class="tag gap">✗ ${g}</span>`).join('')}
          </div>` : ''}
          ${c.recommendation ? `<div style="margin-top:12px;font-size:13px;color:var(--text-dim);font-style:italic;">${c.recommendation}</div>` : ''}
        </div>
      </div>`;
    }).join('');

    // Add click handlers to expand
    filtered.forEach(c => {
      const card = document.getElementById('card-' + c.id);
      if (card) {
        card.addEventListener('click', (e) => {
          if (e.target.type === 'checkbox') return;
          toggleExpand(String(c.id));
        });
      }
    });
  }

  let expandedId = null;
  function toggleExpand(id) {
    if (expandedId === id) {
      expandedId = null;
    } else {
      expandedId = id;
    }
    renderCandidates();
  }

  function toggleSelect(id) {
    if (selectedIds.has(String(id))) selectedIds.delete(String(id));
    else selectedIds.add(String(id));
    updateCompareBar();
  }

  function updateCompareBar() {
    const bar = document.getElementById('compareBar');
    const count = document.getElementById('compareCount');
    count.textContent = selectedIds.size;
    bar.classList.toggle('visible', selectedIds.size >= 2);
  }

  function clearSelection() {
    selectedIds.clear();
    updateCompareBar();
    renderCandidates();
  }

  async function runComparison() {
    const selected = allCandidates.filter(c => selectedIds.has(String(c.id)));
    if (selected.length < 2) return;

    document.getElementById('compareModal').classList.add('open');
    document.getElementById('compareText').textContent = 'Analyzing candidates...';

    // Need OpenAI key — get from session
    const apiKey = sessionInfo && sessionInfo.openai_key;
    if (!apiKey) {
      document.getElementById('compareText').textContent = 'OpenAI key not available for comparison.';
      return;
    }

    const summaries = selected.map(c => {
      let report = c.report;
      if (typeof report === 'string') { try { report = JSON.parse(report); } catch(e) { report = {}; } }
      return `${c.name} — Overall: ${c.overall_score}/100, Verdict: ${c.verdict}
Summary: ${c.summary || report.summary || 'N/A'}
Strengths: ${(report.strengths || []).join(', ')}
Gaps: ${(report.gaps || []).join(', ')}
Recommendation: ${c.recommendation || report.recommendation || 'N/A'}`;
    }).join('\n\n---\n\n');

    try {
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: [
            { role: 'system', content: 'You are a senior hiring manager comparing candidates. Write a concise, specific comparison in plain paragraphs. Name each candidate by name. Be direct about who is stronger and why. End with a clear recommendation.' },
            { role: 'user', content: `Compare these ${selected.length} candidates:\n\n${summaries}\n\nWrite 3-4 paragraphs: (1) strongest candidate and why, (2) key differentiators, (3) concerns, (4) recommendation.` }
          ],
          max_tokens: 600,
          temperature: 0.4
        })
      });
      const data = await res.json();
      document.getElementById('compareText').textContent = data.choices[0].message.content;
    } catch(e) {
      document.getElementById('compareText').textContent = 'Comparison failed: ' + e.message;
    }
  }

  function showError(msg) {
    document.getElementById('loadingDiv').style.display = 'none';
    document.getElementById('errorDiv').style.display = 'block';
    document.getElementById('errorDiv').textContent = msg;
  }

  init();
</script>
</body>
</html>
